[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["docutils==0.22.2"]

[project.optional-dependencies]
training = ["torch>=2.6,<3"]
dev = [
    "pytest>=8,<9",
    "pyright>=1.1,<2",
]

[tool.pyright]
include = ["src/aster"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = [
    "src/aster/agent/candidates.py",
    "src/aster/agent/policy.py",
    "src/aster/evaluator/protocol.py",
    "src/aster/runtime/loop.py",
    "src/aster/tokenizer/bpe.py",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
