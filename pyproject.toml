[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["docutils==0.22.2"]

[project.optional-dependencies]
training = ["torch>=2.6,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

